name: ScanCode v2.0.3 Camera Fix

on:
  push:
    paths:
      - 'release-trigger-v2.0.3.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply camera stabilization patch
        shell: pwsh
        run: |
          python tools/apply-camera-fix-v2.0.3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js src/renderer.js src/index.html package.json qa/qa.js README.md
          git commit -m "Fix ScanCode camera startup and secure renderer origin"
          git push
          "PATCHED $(Get-Date -Format o)" | Set-Content CAMERA_FIX_STAGE_v2.0.3.txt
          git add CAMERA_FIX_STAGE_v2.0.3.txt
          git commit -m "Camera fix stage: patched"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run ScanCode QA
        shell: pwsh
        run: |
          node qa/qa.js
          "QA_OK $(Get-Date -Format o)" | Set-Content CAMERA_FIX_STAGE_v2.0.3.txt
          git add CAMERA_FIX_STAGE_v2.0.3.txt
          git commit -m "Camera fix stage: QA passed"
          git push

      - name: Build Windows Setup EXE
        shell: pwsh
        run: npm run dist:setup

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'ScanCode-Setup-2.0.3-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'ScanCode v2.0.3 Setup EXE was not generated.' }
          Write-Host "Setup ready: $($setup.FullName)"
          Write-Host "Size: $([math]::Round($setup.Length / 1MB, 2)) MB"
          "EXE_BUILT $(Get-Date -Format o)" | Set-Content CAMERA_FIX_STAGE_v2.0.3.txt
          git add CAMERA_FIX_STAGE_v2.0.3.txt
          git commit -m "Camera fix stage: EXE built"
          git push

      - name: Create v2.0.3 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem -Path dist -Filter 'ScanCode-Setup-2.0.3-x64.exe' | Select-Object -First 1).FullName
          $target = (git rev-parse HEAD).Trim()
          if (gh release view v2.0.3 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v2.0.3 "$setup" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v2.0.3 "$setup" `
              --repo $env:GITHUB_REPOSITORY `
              --target $target `
              --title 'ScanCode v2.0.3 — Camera Stabilization' `
              --notes 'Camera stabilization release. Fixes webcam startup/watchdog race, uses a secure ScanCode renderer origin for media APIs, improves camera timeout handling, and preserves existing warehouse recording, QR/barcode, BigSeller bridge, evidence, server sync, and uninstall features. Author: John Mark Bataller.'
          }

      - name: Record successful release
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyy-MM-ddTHH:mm:ssK'
          "ScanCode v2.0.3 Camera Fix SUCCESS`nAsset: ScanCode-Setup-2.0.3-x64.exe`nReleased: $stamp" | Set-Content CAMERA_FIX_SUCCESS_v2.0.3.txt
          "RELEASED $stamp" | Set-Content CAMERA_FIX_STAGE_v2.0.3.txt
          git add CAMERA_FIX_SUCCESS_v2.0.3.txt CAMERA_FIX_STAGE_v2.0.3.txt
          git commit -m "Record successful ScanCode v2.0.3 camera fix release"
          git push
