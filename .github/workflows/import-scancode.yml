name: Import ScanCode v2.0 bundle

on:
  push:
    paths:
      - 'UPLOAD_READY'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Finalize ScanCode bundle upload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild ScanCode bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part_* > /tmp/scancode.b64
          base64 -d /tmp/scancode.b64 > /tmp/scancode.zip
          rm -rf /tmp/scancode
          mkdir -p /tmp/scancode
          unzip -oq /tmp/scancode.zip -d /tmp/scancode
          cp -a /tmp/scancode/ScanCode_V2.0_CAMERA_RESCUE/. .
          rm -rf .upload UPLOAD_READY

      - name: Commit imported ScanCode source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ScanCode Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Upload ScanCode v2.0 Camera Rescue source"
          git push
