name: Build ScanCode Windows Setup

on:
  push:
    paths:
      - 'release-trigger-v2.0.2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Record workflow start
        shell: pwsh
        run: |
          "STARTED $(Get-Date -Format o)" | Set-Content BUILD_STAGE_v2.0.2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STAGE_v2.0.2.txt
          git commit -m "Build stage: v2.0.2 started"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Record dependency stage
        shell: pwsh
        run: |
          "DEPENDENCIES_OK $(Get-Date -Format o)" | Set-Content BUILD_STAGE_v2.0.2.txt
          git add BUILD_STAGE_v2.0.2.txt
          git commit -m "Build stage: v2.0.2 dependencies ready"
          git push

      - name: Run ScanCode software QA
        shell: pwsh
        run: node qa/qa.js

      - name: Record QA stage
        shell: pwsh
        run: |
          "QA_OK $(Get-Date -Format o)" | Set-Content BUILD_STAGE_v2.0.2.txt
          git add BUILD_STAGE_v2.0.2.txt
          git commit -m "Build stage: v2.0.2 QA passed"
          git push

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          & npm run dist:setup 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "BUILD_FAILED $(Get-Date -Format o)" | Set-Content BUILD_STAGE_v2.0.2.txt
            Get-Content build-output.log -Tail 250 | Set-Content BUILD_ERROR_v2.0.2.txt
            git add BUILD_STAGE_v2.0.2.txt BUILD_ERROR_v2.0.2.txt
            git commit -m "Record ScanCode v2.0.2 build failure"
            git push
            exit $code
          }

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'ScanCode-Setup-2.0.2-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'ScanCode Setup EXE was not generated.' }
          Write-Host "Setup ready: $($setup.FullName)"
          Write-Host "Size: $([math]::Round($setup.Length / 1MB, 2)) MB"

      - name: Record EXE build stage
        shell: pwsh
        run: |
          "EXE_BUILT $(Get-Date -Format o)" | Set-Content BUILD_STAGE_v2.0.2.txt
          git add BUILD_STAGE_v2.0.2.txt
          git commit -m "Build stage: v2.0.2 EXE built"
          git push

      - name: Create GitHub Release and upload Setup EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem -Path dist -Filter 'ScanCode-Setup-2.0.2-x64.exe' | Select-Object -First 1).FullName
          if (gh release view v2.0.2 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v2.0.2 "$setup" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v2.0.2 "$setup" `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'ScanCode v2.0.2 — Windows Setup' `
              --notes 'Deployment release for warehouse PCs. Download ScanCode-Setup-2.0.2-x64.exe, run it as Administrator, and ScanCode will install system-wide with Desktop/Start Menu shortcuts and Windows uninstall registration. Author: John Mark Bataller.'
          }

      - name: Record verified build success
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyy-MM-ddTHH:mm:ssK'
          "ScanCode v2.0.2 Windows Setup build SUCCESS`nAsset: ScanCode-Setup-2.0.2-x64.exe`nBuilt: $stamp`nCommit: $env:GITHUB_SHA" | Set-Content BUILD_SUCCESS_v2.0.2.txt
          "RELEASED $stamp" | Set-Content BUILD_STAGE_v2.0.2.txt
          git add BUILD_SUCCESS_v2.0.2.txt BUILD_STAGE_v2.0.2.txt
          git commit -m "Record successful ScanCode v2.0.2 Windows Setup release"
          git push
