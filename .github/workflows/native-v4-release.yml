name: ScanCode v4 Native Windows Release

on:
  push:
    paths:
      - 'release-trigger-native-v4.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip && pip install -r native/requirements.txt

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile native/scancode_core.py
          python -m py_compile native/scancode_app.py
          python -m py_compile native/test_native_core.py

      - name: Native runtime core test
        shell: pwsh
        run: |
          Push-Location native
          python test_native_core.py
          Pop-Location

      - name: Build portable native EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ScanCode `
            --collect-all zxingcpp `
            --collect-all cv2 `
            --hidden-import PIL._tkinter_finder `
            --distpath dist `
            --workpath build-native `
            --specpath build-native `
            native/scancode_app.py
          if (-not (Test-Path dist/ScanCode.exe)) { throw 'Native ScanCode.exe was not generated.' }

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler unavailable.' }

      - name: Create Windows installer
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{A614B34B-7133-4B78-B0EC-50E0FA642D04}
          AppName=ScanCode
          AppVersion=4.0.0
          AppPublisher=John Mark Bataller
          VersionInfoCompany=John Mark Bataller
          VersionInfoDescription=ScanCode Warehouse Parcel Scanner
          VersionInfoVersion=4.0.0.0
          DefaultDirName={autopf}\ScanCode
          DefaultGroupName=ScanCode
          OutputDir=dist
          OutputBaseFilename=ScanCode-Setup-4.0.0-x64
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayName=ScanCode — John Mark Bataller
          WizardStyle=modern
          
          [Files]
          Source: "dist\ScanCode.exe"; DestDir: "{app}"; Flags: ignoreversion
          
          [Icons]
          Name: "{autoprograms}\ScanCode"; Filename: "{app}\ScanCode.exe"
          Name: "{autodesktop}\ScanCode"; Filename: "{app}\ScanCode.exe"
          
          [Run]
          Filename: "{app}\ScanCode.exe"; Description: "Launch ScanCode"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content scancode-v4.iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' scancode-v4.iss
          if (-not (Test-Path dist/ScanCode-Setup-4.0.0-x64.exe)) { throw 'Setup EXE was not generated.' }

      - name: Publish v4.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v4.0.0 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v4.0.0 dist/ScanCode-Setup-4.0.0-x64.exe dist/ScanCode.exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v4.0.0 dist/ScanCode-Setup-4.0.0-x64.exe dist/ScanCode.exe `
              --repo $env:GITHUB_REPOSITORY `
              --target main `
              --title 'ScanCode v4.0.0 — Native Windows Rebuild' `
              --notes 'Native Windows rebuild: OpenCV DirectShow/MSMF camera capture, ZXing-C++ QR/barcode scanning, parcel video recording, waybill evidence, server SHA-256 sync, BigSeller Windows UI Automation beta, red/black responsive UI. Electron/Chromium is no longer used for the camera. Author: John Mark Bataller.'
          }

      - name: Record success
        shell: pwsh
        run: |
          "ScanCode v4.0.0 NATIVE BUILD SUCCESS`nCore tests: PASS`nInstaller: ScanCode-Setup-4.0.0-x64.exe`nBuilt: $(Get-Date -Format o)" | Set-Content NATIVE_V4_SUCCESS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add NATIVE_V4_SUCCESS.txt
          git commit -m "Record ScanCode v4.0.0 native Windows release"
          git push
